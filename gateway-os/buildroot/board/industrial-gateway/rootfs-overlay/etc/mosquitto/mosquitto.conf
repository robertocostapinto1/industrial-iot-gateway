# Core Security Configuration
# ===========================

# MQTT over TLS (MQTTS)
listener 8883
protocol mqtt

# Paths to the certificates injected via RootFS Overlay
cafile /etc/mosquitto/certs/ca.crt
certfile /etc/mosquitto/certs/gateway.crt
keyfile /etc/mosquitto/certs/gateway.key

# Security Policy
# ----------------
# Require a username/password (set later)
allow_anonymous false

# Force modern encryption
tls_version tlsv1.2

# Persistence
# -----------
# Save the internal database to disk so messages survive reboots
persistence true
persistence_location /var/lib/mosquitto/

# Logging for Industrial Auditing
# -------------------------------
log_dest file /var/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
